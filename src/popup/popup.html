<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LayoutPilot</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup">
      <header class="header">
        <div class="brand-mark">LP</div>
        <div>
          <h1>LayoutPilot</h1>
          <p>Spacing and size inspector</p>
        </div>
      </header>

      <section class="status-card">
        <span id="status-dot" class="status-dot"></span>
        <span id="status-text">Checking current tab...</span>
      </section>

      <button id="toggle-button" class="primary-button" type="button">
        Toggle inspect mode
      </button>

      <section class="help">
        <strong>How to use</strong>
        <p>Move the mouse to inspect size, padding and margin.</p>
        <p>Click an element to pin it, then hover another element to compare spacing.</p>
        <p>Press <kbd>Esc</kbd> to turn off inspect mode.</p>
      </section>
    </main>
    <script src="popup.js"></script>
  </body>
</html>

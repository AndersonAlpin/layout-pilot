<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LayoutPilot</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup">
      <header class="header">
        <div class="brand">
          <img class="brand-logo" src="../assets/brand/logo-horizontal.png" alt="LayoutPilot" />
        </div>
        <div id="language-picker" class="language-picker">
          <button id="language-toggle" class="language-toggle" type="button" aria-haspopup="listbox" aria-expanded="false">
            <img id="language-current-flag" class="language-current-flag" src="../assets/flags/pt-BR.png" width="20" height="14" alt="" aria-hidden="true" />
            <span class="language-chevron" aria-hidden="true"></span>
          </button>
          <div id="language-menu" class="language-menu" role="listbox" hidden></div>
        </div>
      </header>

      <section class="status-card">
        <span id="status-dot" class="status-dot"></span>
        <span id="status-text">Verificando aba atual...</span>
      </section>

      <button id="toggle-button" class="primary-button" type="button">
        Ativar
      </button>

      <div class="popup-scroll">
        <section class="mode-card" aria-labelledby="mode-title">
          <strong id="mode-title">Modo</strong>
          <label class="mode-option">
            <input id="mode-inspect" type="radio" name="mode" value="inspect" checked />
            <span>
              <b id="mode-inspect-name">Modo Inspeção</b>
              <small id="mode-inspect-description">Hover, pin, detalhes e contexto simples.</small>
            </span>
          </label>
          <label class="mode-option">
            <input id="mode-review" type="radio" name="mode" value="review" />
            <span>
              <b id="mode-review-name">Modo Revisão</b>
              <small id="mode-review-description">Crie anotações visuais, marque áreas e exporte a revisão.</small>
            </span>
          </label>
        </section>

        <section class="breakpoint-card" aria-labelledby="breakpoint-title">
          <div class="breakpoint-card-header">
            <strong id="breakpoint-title">Visualização responsiva</strong>
          </div>
          <p id="breakpoint-description" class="breakpoint-description">
            Visualize a página em tamanhos de dispositivos sem reduzir a janela.
          </p>
          <button id="breakpoint-toggle" class="breakpoint-switch" type="button" role="switch" aria-checked="false">
            <span class="breakpoint-switch-track" aria-hidden="true"><span class="breakpoint-switch-thumb"></span></span>
            <span id="breakpoint-switch-label" class="breakpoint-switch-label">Ativar visualização</span>
          </button>
          <div class="breakpoint-summary">
            <span id="breakpoint-summary-label">Atual</span>
            <b id="breakpoint-summary-value">iPhone 16/17 Pro · 402 x 874</b>
          </div>
        </section>

        <section class="shortcuts" aria-labelledby="shortcuts-title">
          <strong id="shortcuts-title">Atalhos</strong>
          <div id="shortcut-grid" class="shortcut-grid">
            <div class="shortcut-item"><kbd>I</kbd><span id="shortcut-inspect">Inspeção</span></div>
            <div class="shortcut-item"><kbd>H</kbd><span id="shortcut-help">Atalhos</span></div>
            <div class="shortcut-item"><kbd>Esc</kbd><span id="shortcut-cancel">Cancelar</span></div>
            <div class="shortcut-item"><kbd>C</kbd><span id="shortcut-context">Contexto simples</span></div>
            <div class="shortcut-item"><kbd>P</kbd><span id="shortcut-pin">Fixar</span></div>
            <div class="shortcut-item"><kbd>D</kbd><span id="shortcut-details">Detalhes</span></div>
          </div>
          <p id="shortcut-note" class="shortcut-note">I funciona depois de ativar nesta aba pelo popup.</p>
        </section>
      </div>
    </main>
    <script src="../shared/constants.js"></script>
    <script src="../shared/locales/en.js"></script>
    <script src="../shared/locales/pt-BR.js"></script>
    <script src="../shared/locales/es.js"></script>
    <script src="../shared/i18n.js"></script>
    <script src="../shared/messaging.js"></script>
    <script src="../content/breakpoint/breakpoint-presets.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
